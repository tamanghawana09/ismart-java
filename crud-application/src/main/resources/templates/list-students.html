<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
    <h1 class="text-center mb-4">Students List</h1>
    <p>Added by: <span th:text="${targetUser.username}"></span></p>

    <div class="mb-3 d-flex justify-content-end">
        <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
    </div>
    <div class="table-responsive">
        <table class="table table-striped table-bordered align-middle">
            <thead class="table-primary">
            <tr>
                <th>ID</th>
                <th>First Name</th>
                <th>Last Name</th>
                <th>Email</th>
                <th>Number</th>
                <th>Birthdate</th>
                <th>SEE Marks</th>
                <th>+2 Marks</th>
                <th>Course</th>
                <th>Gender</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="student : ${student}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.fname}"></td>
                <td th:text="${student.lname}"></td>
                <td th:text="${student.email}"></td>
                <td th:text="${student.number}"></td>
                <td th:text="${student.birthdate}"></td>
                <td th:text="${student.markssee}"></td>
                <td th:text="${student.marksPlus2}"></td>
                <td th:text="${student.course}"></td>
                <td th:text="${student.gender}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
