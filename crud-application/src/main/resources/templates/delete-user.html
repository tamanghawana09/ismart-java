<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete User Details</title>
</head>
<body>
<h1 class="text-md-center">Delete User Details</h1>
<form th:action="@{/delete-user/{id}(id=${user.id})}" method="post" class="needs-validation" novalidate>
  <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
  <input type="number" name="id" placeholder="Enter User ID" required />
  <button type="submit">Delete</button>
</form>
</body>
</html>
