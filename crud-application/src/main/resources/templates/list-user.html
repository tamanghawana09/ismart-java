<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User list</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
</head>
<body>
<div class="container my-5">
  <h1 class="text-center mb-4">Users List</h1>
  <div class="mb-3 d-flex justify-content-between">
    <a href="/admin/new-user" class="btn btn-success">Add New User</a>
    <a href="/admin/dashboard" class="btn btn-secondary">Back to Dashboard</a>
  </div>

  <div class="table-responsive">
    <table class="table table-striped table-bordered align-middle">
      <thead class="table-primary">
      <tr>
        <th>ID</th>
        <th>User</th>
        <th>Email</th>
        <th>Password</th>
        <th>Role</th>
        <th>Students Added</th>
        <th>Options</th>
      </tr>
      </thead>
      <tbody>
      <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.username}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.password}"></td>
        <td th:text="${user.role}"></td>
        <td> No of Students Added</td>
        <td>
          <a th:href="@{/admin/edit-user/{id}(id=${user.id})}"  class="btn btn-warning btn-sm mb-1">Edit</a>
          <a th:href="@{/admin/delete-user/{id}(id=${user.id})}"  class="btn btn-danger btn-sm mb-1">Delete</a>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
