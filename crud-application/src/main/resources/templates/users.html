<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User list</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container my-5">
      <h1 class="text-center mb-4">Users List</h1>
      <div class="mb-3 d-flex justify-content-between">
        <a href="/new-user" class="btn btn-success">Add New User</a>
        <a href="/dashboard-admin" class="btn btn-secondary">Back to Dashboard</a>
      </div>

      <div class="table-responsive">
          <table class="table table-striped table-bordered align-middle">
            <thead class="table-primary">
              <tr>
                <th>ID</th>
                <th>User</th>
                <th>Email</th>
                <th>Role</th>
                <th>Students Added</th>
              </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
              <td th:text="${user.id}"></td>
              <td th:text="${user.username}"></td>
              <td th:text="${user.email}"></td>
              <td th:text="${user.role}"></td>
              <td th:text="${user.studentAdded}"></td>
              <td>
                <a class="btn btn-warning btn-sm mb-1">Edit</a>
                <a class="btn btn-danger btn-sm mb-1">Delete</a>
              </td>
            </tr>
            </tbody>
          </table>
      </div>
  </div>
  <script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
