<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete details</title>
</head>
<body>
<h1 class="text-md-center">Delete Student Details</h1>
<form th:action="@{/delete/{id}(id=${student.id})}" method="post" class="needs-validation" novalidate>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
    <input type="number" name="id" placeholder="Enter Student ID" required />
    <button type="submit">Delete</button>
</form>
</body>
</html>
