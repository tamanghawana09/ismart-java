<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit user</title>

  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.8/css/bootstrap.min.css}">
</head>
<body>

<div class="container my-5">
  <h1 class="text-center mb-4">Edit user</h1>

  <form th:action="@{/admin/update-user/{id}(id=${user.id})}" method="post" class="needs-validation" novalidate>
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <div class="mb-3">
      <label class="form-label">User ID:</label>
      <span class="form-control-plaintext" th:text="${user.id}"></span>
    </div>

    <div class="row mb-3">
      <div class="col-md-6">
        <label for="username" class="form-label">User Name</label>
        <input type="text" class="form-control" id="username" name="username" th:value="${user.username}" required>
      </div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" th:value="${user.email}" required>
    </div>

    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" class="form-control" id="password" name="password" th:value="${user.password}" required>
    </div>

    <div class="text-center">
      <button type="submit" class="btn btn-primary btn-lg">Update User</button>
    </div>
  </form>

  <div class="text-center mt-3">
    <a href="/admin/list-user" class="btn btn-secondary">Back to List</a>
  </div>
</div>


<script th:src="@{/webjars/bootstrap/5.3.8/js/bootstrap.bundle.min.js}"></script>


</body>
</html>
