<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
    <h1 class="text-center mb-4">Welcome to Dashboard</h1>

    <p>Logged in as: <span th:text="${username}"></span></p>
    <div class="row g-4 justify-content-center">
        <!-- View Users Button -->
        <div class="col-md-3 d-grid">
            <a href="/admin/list-user" class="btn btn-primary btn-lg shadow-sm">View Users</a>
        </div>

        <!-- Add Student Button -->
        <div class="col-md-3 d-grid">
            <a href="/admin/new-user" class="btn btn-success btn-lg shadow-sm">Add Users</a>
        </div>

        <!-- Edit Student Button -->
        <div class="col-md-3 d-grid">
            <a href="/admin/list-user" class="btn btn-warning btn-lg shadow-sm text-dark">Edit Users</a>
        </div>

        <!-- Delete Student Button -->
        <div class="col-md-3 d-grid">
            <a href="/admin/list-user" class="btn btn-danger btn-lg shadow-sm">Delete Userst</a>
        </div>
    </div>

    <div class="text-center mt-5">
        <form th:action="@{/admin/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-outline-secondary btn-lg">Logout</button>
        </form>
    </div>
</div>
</body>
</html>
